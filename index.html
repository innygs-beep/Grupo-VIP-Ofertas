<meta charset="UTF-8" />

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap');

* { box-sizing: border-box; }

html,body{height:100%;}

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background-color: #d2bba3;
    background-image:
      url('https://images.unsplash.com/photo-1607083206968-13611e3d76db?auto=format&fit=crop&w=1400&q=60'),
      url('https://images.unsplash.com/photo-1616627451802-c8a54b3c84f5?auto=format&fit=crop&w=1400&q=60'),
      url('https://images.unsplash.com/photo-1580894740849-6119a80c1f49?auto=format&fit=crop&w=1400&q=60');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-blend-mode: overlay;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    flex-direction: column;
}

/* ====== CONTAINER ORIGINAL ====== */
.container {
    background-color: #f5ede2;
    border-radius: 20px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    padding: 40px 30px;
    text-align: center;
    max-width: 420px;
    width: 100%;
    position: relative;
}

/* wrapper para manter logo + vagas + pessoas online centralizados */
.logo-vagas-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    gap: 8px;
}

/* ====== LOGO ====== */
img {
    width: 120px;
    margin: 0;
    border-radius: 50%;
}

/* ====== BALÃO DAS VAGAS ====== */
.vagas-balao {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px; 
    padding: 8px 16px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    background: linear-gradient(90deg,#ff6b6b,#ff3b3b);
    color: #fff;
    box-shadow: 0 6px 18px rgba(255,80,80,0.16);
    min-width: 140px; 
    text-align:center;
    animation: pulse 1.8s ease-in-out infinite;
    transition: background 0.25s, box-shadow 0.25s, transform 0.15s;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.04); }
    100% { transform: scale(1); }
}

.vagas-balao.urgente {
    background: linear-gradient(90deg,#ff3b3b,#d40000) !important;
    box-shadow: 0 8px 26px rgba(212,0,0,0.25) !important;
    animation: pulseUrg 1.1s ease-in-out infinite !important;
}

@keyframes pulseUrg {
    0% { transform: scale(1); }
    50% { transform: scale(1.12); }
    100% { transform: scale(1); }
}

/* ====== CONTADOR ONLINE ====== */
.online-counter {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
    font-size: 14px;
    font-weight: 600;
    color: #8b6b4f;
    background: rgba(255,255,255,0.9);
    padding: 6px 12px;
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    white-space: nowrap;
}

.online-dot {
    width: 10px;
    height: 10px;
    background: #2ecc71; 
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(46,204,113,0.35);
}

h1 {
    color: #8b6b4f;
    font-size: 22px;
    font-weight: 700;
    margin: 12px 0 8px 0;
}

.subtitle {
    color: #8b6b4f;
    font-size: 15px;
    font-weight: 500;
    line-height: 1.6;
    margin-bottom: 12px;
}

.fade-in {
    opacity: 0;
    transform: translateY(15px);
    animation: fadeInUp 1s ease forwards;
}

.fade-in:nth-child(1) { animation-delay: 0.2s; }
.fade-in:nth-child(2) { animation-delay: 0.6s; }
.fade-in:nth-child(3) { animation-delay: 1s; }
.fade-in:nth-child(4) { animation-delay: 1.4s; }

@keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

a.button {
    display: inline-block;
    background: linear-gradient(90deg, #00c851, #007e33);
    color: white;
    padding: 14px 25px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 700;
    position: relative;
    overflow: hidden;
    animation: bounce 1.5s infinite ease-in-out;
    margin: 12px 0;
    box-shadow: 0 6px 18px rgba(0, 200, 81, 0.35);
}

a.button::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.36);
    transform: skewX(-25deg);
    transition: left 0.6s ease;
}

a.button:hover::after { left: 200%; }

@keyframes bounce { 0%,100% { transform: scale(1);} 50% { transform: scale(1.08);} }

.subproof { color: #6d523d; font-size: 13px; margin-bottom: 12px; opacity: 0.95; }

.security { color: #6d523d; font-size: 12px; margin-top: 12px; display:inline-flex; gap:8px; align-items:center; }
.security img { width:16px; height:16px; }

/* POPUPS */
.popup {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background-color: #ffffff;
    color: #6d523d;
    padding: 10px 16px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.45s ease;
    z-index: 9999;
    border: 1px solid rgba(0,0,0,0.04);
}
.popup.show { opacity:1; transform: translateY(0); }
.popup.hide { opacity:0; transform: translateY(20px); }

@media (max-width:600px){
    .container { padding:30px 20px; border-radius:15px; }
    img { width:90px; }
    h1 { font-size:20px; }
    .popup { bottom:15px; right:15px; font-size:13px; padding:8px 12px; }
    .vagas-balao { min-width: 100px; font-size:15px; padding:8px 12px; }
    .online-counter { font-size:13px; padding:6px 10px; }
}
</style>
</head>
<body>

<div class="container">

    <div class="logo-vagas-wrap">
        <img src="logo.jpeg" alt="Logo Encantos" id="logoMain" />

        <div id="vagaBox" class="vagas-balao" aria-live="polite">
            <span class="vaga-text">Restam</span>

        <div id="onlineCounter" class="online-counter">
            <span class="online-dot" aria-hidden="true"></span>
            <span id="onlineNum">38</span> pessoas online agora

    <h1>GRUPO VIP DE OFERTAS ⤵️</h1>

    <p class="subtitle fade-in"> Descubra achados exclusivos, preços relâmpago e descontos que acabam em minutos — enviados direto no seu WhatsApp.</p>

    <div class="security">

</div>

<script>
let vagas = 25;
const vagaNumEl = document.getElementById('vagasNum');
const vagaBoxEl = document.getElementById('vagaBox');

let basePopupMin = 6000;
let basePopupMax = 14000;

let online = 38;
const onlineEl = document.getElementById('onlineNum');
function atualizarOnline() {
    const variacao = Math.floor(Math.random() * 7) - 3;
    online = Math.max(38, Math.min(54, online + variacao));
    onlineEl.textContent = online;
    setTimeout(atualizarOnline, Math.floor(Math.random()*5000) + 3000);
}
setTimeout(atualizarOnline, 1200);

const nomes = [
 "Ana Clara", "Maria Eduarda", "Lúcia Helena", "Gabriela N.", "Isabela R.", "Júlia M.", "Carolina V.", "Beatriz M.", "Larissa P.", "Camila A.", "Fernanda R.", "Vitória S.", "Marina D.", "Alice M.", "Laura F.", "Natália B.", "Helena C.", "Valentina A.", "Manuela P.", "Cecília A.", "Bruna M.", "Paula A.", "Luana F.", "Patrícia G.", "Danielle F.", "Renata R.", "Melissa A.", "Lorena C.", "Nicole B.", "Bianca T.", "Amanda S.", "Evelyn P.", "Eduarda F.", "Débora M.", "Juliana L.", "Mayara R.", "Yasmin C.", "Estela G.", "Carina V.", "Viviane S.", "Flávia C.", "Sabrina V.", "Letícia S.", "Rebeca M.", "Clara A.", "Tainá L.", "Elisa M.", "Alana C.", "Joana F.", "Heloísa C.", "Marcela S.", "Tatiane D.", "Ariane A.", "Mirella S.", "Lívia B.", "Stella M.", "Pérola S.", "Aline C.", "Késia B.", "Luísa P.", "Catarina R.", "Pâmela F.", "Morgana Q.", "Fabiana S.", "Soraya B.", "Talita N.", "Clarice T.", "Noemi A.", "Priscila L.", "Mariele T.", "Andreia F.", "Geovana L.", "Naiara C.", "Caroline M.", "Marlene V.", "Érica D.", "Brenda X.", "Jéssica A.", "Ísis C.", "Suelen F.", "Ariadne V.", "Penélope D.", "Samara P.", "Gláucia T.", "Letícia V.", "Adriana F.", "Mirian L.", "Rafaela M.", "Cíntia B.", "Tamara B.", "Rafael Esteves", "Gustavo Peixoto", "Lucas Ferreira", "Henrique D.", "Eduardo S."
];

// REMOVIDO: audio

function atualizaVisualVagas() {
    if (vagas <= 0) {
        vagaBoxEl.innerHTML = "🚨 Grupo LOTADO! Aguarde novas vagas.";
        return;
    }
    vagaNumEl.textContent = vagas;

    if (vagas <= 5) {
        vagaBoxEl.classList.add('urgente');
    } else {
        vagaBoxEl.classList.remove('urgente');
    }
}

function diminuirVaga() {
    if (vagas <= 0) return;
    vagas = Math.max(0, vagas - 1);
    atualizaVisualVagas();
}

function mostrarPopup() {
    if (vagas <= 0) return;

    const nome = nomes[Math.floor(Math.random() * nomes.length)];
    const popup = document.createElement('div');
    popup.className = 'popup';
    popup.textContent = `${nome} entrou no grupo.`;
    document.body.appendChild(popup);

    setTimeout(()=> popup.classList.add('show'), 10);

    // REMOVIDO SOMENTE O ÁUDIO
    // audio.currentTime = 0;
    // audio.volume = 0.12;
    // audio.play().catch(()=>{});

    diminuirVaga();

    setTimeout(()=> {
        popup.classList.remove('show');
        popup.classList.add('hide');
        setTimeout(()=> popup.remove(), 420);
    }, 4600);
}

function scheduleNextPopup() {
    if (vagas <= 0) return null;

    let min = basePopupMin;
    let max = basePopupMax;

    if (vagas <= 4) {
        min = 18000; max = 26000;
    } else if (vagas <= 7) {
        min = 12000; max = 18000;
    } else if (vagas <= 11) {
        min = 8000; max = 14000;
    }

    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function startPopups() {
    if (vagas <= 0) return;
    mostrarPopup();
    const intervalo = scheduleNextPopup();
    setTimeout(startPopups, intervalo);
}

atualizaVisualVagas();
setTimeout(startPopups, 2000);
</script>
